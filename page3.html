<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Wildlife</title>
</head>
<body>
  <h1 style="text-align: center; font-family: 'Roboto', sans-serif; font-size: 70px;">
    Wildlife
  </h1>
  <p style="text-align: center; font-size: 30px;">
    Animals in Yellowstone
  </p>
  <hr>

  <div class="image-row">
    <div class="image-item">
      <p><b>Grizzly Bear</b></p>
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Yellowstone-grizzly-00156.jpg" alt="Grizzly Bear">
    </div>
    <div class="image-item">
      <p><b>Elk</b></p>
      <img src="https://zoo.aurora.il.us/files/assets/zoo/v/1/images/american-elk-in-nature.jpg?w=1200" alt="Elk">
    </div>
    <div class="image-item">
      <p><b>Wolf</b></p>
      <img src="https://cdn.britannica.com/07/5207-050-5BC9F251/Gray-wolf.jpg" alt="Wolf">
    </div>
  </div>

  <div class="image-row">
    <div class="image-item">
      <p><b>Bison</b></p>
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/8d/American_bison_k5680-1.jpg" alt="Bison">
    </div>
    <div class="image-item">
      <p><b>Bald Eagle</b></p>
      <img src="https://www.chesapeakebay.net/files/critters/_700x600_fit_center-center_none/20170420-IMG_2639.jpg" alt="Bald Eagle">
    </div>
    <div class="image-item">
      <p><b>Moose</b></p>
      <img src="https://i.natgeofe.com/k/592a06c1-c845-4851-a3fa-7be62e753683/full-body-moose_square.jpg" alt="Moose">
    </div>
  </div>
</body>
</html>
